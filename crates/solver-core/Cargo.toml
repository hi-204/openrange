[package]
name = "solver-core"
description = "OpenRange solver core: cards, evaluator, ranges, equity, CFR."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# JSON spot format (used by solver-cli and solver-wasm); off by default so the core has no
# dependencies.
json = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
