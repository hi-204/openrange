# Glossary: term (lower case) → definition. Lessons mark terms with [[term]] or [[term|label]].
# Plain English, one or two sentences, no undefined jargon.

equity: >-
  Your share of the pot on average if all the remaining cards were dealt with no more betting.
  Ties count half.
implied odds: >-
  Extra money you expect to win on later streets when you hit, which can make a call pay even
  when the current price is too high.
pot odds: >-
  The price of a call: what you pay divided by the pot you will have after calling. You need at
  least that much equity for the call to break even.
range: >-
  All the hands a player could hold in a spot, with how often they would play each one this
  way. Good decisions think about ranges, not single hands.
showdown: >-
  The end of a hand when two or more players are left after the last bet: they show their cards
  and the best five-card hand wins.
"6-max": >-
  A table with at most six players, the most common online cash format and the one this course uses.
all-in: >-
  Betting all the chips you have in front of you. You can't be forced to put in more than that.
angle shooting: >-
  A move that may be within the letter of the rules but is meant to mislead, such as pretending to fold. Considered bad etiquette.
bet: >-
  Putting chips into the pot when nobody else has in this betting round. Others must match it, raise or fold.
big blind: >-
  The forced bet posted by the second player to the left of the button before the cards are dealt.
"big blind (bb)": >-
  The unit for amounts in this course: one big blind. Thinking in big blinds makes stakes comparable.
blinds: >-
  The two forced bets (small blind and big blind) posted before each hand so there is always something to win.
board: >-
  The shared cards dealt face up in the middle of the table, up to five, that every player can use.
button: >-
  The disc that marks the dealer position. It moves one seat clockwise every hand; the button acts last after the flop.
buy-in: >-
  The fixed price to enter a tournament, or the amount you sit down with in a cash game.
call: >-
  Putting in exactly enough chips to match the current bet.
cash game: >-
  A game where chips are real money, the blinds stay the same, and you can join or leave at any time.
check: >-
  Passing without betting when nobody has bet yet in the round. You stay in the hand.
flop: >-
  The first three shared cards, dealt together after the preflop betting.
flush: >-
  Five cards of the same suit, not in sequence. It beats a straight and loses to a full house.
fold: >-
  Giving up the hand and any chips already put in.
full house: >-
  Three cards of one rank and two of another. It beats a flush and loses to four of a kind.
hole cards: >-
  Your two private cards, dealt face down.
kicker: >-
  A card that isn't part of the pair (or other combination) but breaks ties between equal hands.
muck: >-
  To throw your cards away face down without showing them, or the pile of discarded cards.
no-limit: >-
  A betting structure where you may bet or raise any amount up to all your chips.
playing the board: >-
  When the five board cards are a player's best hand, so their hole cards don't play.
pot: >-
  All the chips bet in the hand so far, won by the last player left or the best hand at showdown.
preflop: >-
  The first betting round, after the hole cards are dealt and before the flop.
raise: >-
  Putting in more than the current bet, so the others must match the larger amount.
river: >-
  The fifth and last shared card, followed by the last betting round.
side pot: >-
  A separate pot that forms when a player is all-in: only the players who put chips into it can win it.
small blind: >-
  The forced bet posted by the player directly to the left of the button, usually half the big blind.
split pot: >-
  A pot shared equally between players whose best five cards are equal.
stack: >-
  The chips a player has in front of them, usually counted in big blinds.
straight: >-
  Five cards in sequence of mixed suits. The ace can be high or low, but a straight can't wrap around.
string bet: >-
  Putting chips forward in several motions without announcing the amount first. Dealers may count only the first part.
tournament: >-
  A format where everyone buys in for the same amount, blinds rise over time, and prizes are paid by finishing place.
turn: >-
  The fourth shared card, dealt after the flop betting.
position: >-
  Where you sit relative to the button, which decides when you act. Acting later is an advantage.
in position: >-
  Acting after your opponent on the flop, turn and river, so you see their decision before making yours.
out of position: >-
  Acting before your opponent on the flop, turn and river.
under the gun: >-
  The first seat to act before the flop, just left of the big blind (UTG).
combo: >-
  One specific pair of hole cards, such as A♠K♦. There are 1326 combos in total.
suited: >-
  Two hole cards of the same suit, such as K♥Q♥, written KQs. Each suited hand has 4 combos.
offsuit: >-
  Two hole cards of different suits, such as K♥Q♣, written KQo. Each offsuit hand has 12 combos.
pocket pair: >-
  Two hole cards of the same rank, such as 7♣7♦. Each pocket pair has 6 combos.
broadway: >-
  A card from ten to ace. Broadway hands are two such cards, such as KQ or AJ.
suited connector: >-
  Two suited cards next to each other in rank, such as 8♥7♥. They make straights and flushes.
set: >-
  Three of a kind made with a pocket pair and one matching card on the board.
dominated: >-
  Holding a hand that shares a card with a better one, such as A7 against AK, so it rarely wins when both pair.
limp: >-
  Calling the big blind before the flop instead of raising, when nobody has raised yet.
open-raise: >-
  The first raise before the flop, made when everyone before you has folded.
fold equity: >-
  The value a bet gains from the chance that your opponent folds.
mixed strategy: >-
  Playing the same hand in more than one way, each a set share of the time. Charts show it as a cell split into colours.
outs: >-
  The cards still to come that would give you the best hand.
draw: >-
  A hand that is behind now but can improve to the best hand with the right cards, such as four cards to a flush.
flush draw: >-
  Four cards of one suit, needing one more for a flush. Nine cards of that suit are left.
open-ended straight draw: >-
  Four cards in a row that a card at either end turns into a straight, such as 9-8-7-6. Eight cards complete it.
gutshot: >-
  A straight draw missing one card in the middle, such as 9-8-6-5 needing a 7. Four cards complete it.
tainted out: >-
  A card that completes your hand but also gives your opponent a better one, so it isn't a real out.
runner-runner: >-
  A hand made by both the turn and the river, when neither card alone would be enough.
coin flip: >-
  An all-in where both players have close to half the equity, such as a pair against two higher cards.
expected value: >-
  What a decision wins or loses on average if you made it many times (EV): the sum of each outcome's chance times its result.
reverse implied odds: >-
  Money you expect to lose on later streets when you hit a hand that is still second best.
card removal: >-
  How the cards you can see (yours and the board) change which hands your opponent can hold.
blocker: >-
  A card in your hand that makes some of your opponent's hands impossible or less likely.
3-bet: >-
  The re-raise of an open before the flop (the blinds count as the first bet, the open as the second).
4-bet: >-
  The re-raise of a 3-bet.
5-bet: >-
  The re-raise of a 4-bet. At 100 bb it is usually all-in.
cold call: >-
  Calling a raise when you have no money in the pot yet, for example calling an open from the button.
closing the action: >-
  Being the last player to act in a betting round, so nobody can raise after your call.
value: >-
  Betting or raising with a strong hand so that worse hands put more money in.
bluff: >-
  Betting or raising with a weak hand to make better hands fold.
squeeze: >-
  A 3-bet after an open and at least one call.
capped range: >-
  A range without the strongest hands, usually because the player would have raised with them.
dead money: >-
  Chips in the pot from a player who is likely to fold, which anyone can win.
stack-to-pot ratio: >-
  The smaller stack behind divided by the pot (SPR). The lower it is, the sooner all the money goes in.
continuation bet: >-
  A bet on the flop by the player who made the last raise before the flop (a c-bet).
range bet: >-
  Betting with almost every hand in your range, usually with a small size.
board texture: >-
  What a board allows: how many cards share a suit, whether it is paired, and how connected its ranks are.
dry board: >-
  A board with few draws or strong hands possible, such as K-7-2 in three suits.
wet board: >-
  A board with many draws and strong hands possible, such as J-T-9 with two hearts.
rainbow: >-
  A flop with three different suits, so no flush draw is possible yet.
two-tone: >-
  A flop with two cards of one suit, so flush draws are possible.
monotone: >-
  A flop with all three cards of one suit, so a flush is already possible.
paired board: >-
  A board with two cards of the same rank, which makes trips and full houses possible.
range advantage: >-
  Having more equity on average than your opponent's range on a board.
nut advantage: >-
  Having more of the very strongest hands than your opponent's range on a board.
equity realization: >-
  How much of your equity you actually win once the betting is played out. Position and range strength change it.
initiative: >-
  Being the last player to bet or raise, so that you are expected to bet next.
committed: >-
  Having so much of your stack in the pot, relative to what is left, that folding is rarely right.
check-raise: >-
  Checking, then raising after your opponent bets.
semi-bluff: >-
  A bet or raise with a draw: it can win when the opponent folds, and it can still improve when called.
checking range: >-
  All the hands you check with in a spot.
barrel: >-
  Betting again on a later street after betting the previous one.
bluff catcher: >-
  A hand that beats your opponent's bluffs but loses to their value bets.
polarized: >-
  A range made of strong hands and bluffs, with few medium hands.
merged: >-
  A range that includes many medium hands as well as strong ones.
minimum defence frequency: >-
  The share of your range you must continue with so that a pure bluff of B into a pot P doesn't profit at once: P ÷ (P + B).
overbet: >-
  A bet bigger than the pot.
