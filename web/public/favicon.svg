<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- OpenRange icon: an original 13×13-grid motif (a range chart) in the app's accent colour. -->
  <rect width="32" height="32" rx="7" fill="#4f50cf"/>
  <g fill="#ffffff">
    <rect x="7" y="7" width="5" height="5" rx="1"/>
    <rect x="13.5" y="7" width="5" height="5" rx="1"/>
    <rect x="20" y="7" width="5" height="5" rx="1" opacity="0.45"/>
    <rect x="7" y="13.5" width="5" height="5" rx="1"/>
    <rect x="13.5" y="13.5" width="5" height="5" rx="1" opacity="0.45"/>
    <rect x="20" y="13.5" width="5" height="5" rx="1" opacity="0.2"/>
    <rect x="7" y="20" width="5" height="5" rx="1" opacity="0.45"/>
    <rect x="13.5" y="20" width="5" height="5" rx="1" opacity="0.2"/>
    <rect x="20" y="20" width="5" height="5" rx="1" opacity="0.2"/>
  </g>
</svg>
