[workspace]
resolver = "3"
members = ["crates/solver-core", "crates/solver-cli", "crates/solver-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/local/openrange"
rust-version = "1.99"

[workspace.dependencies]
solver-core = { path = "crates/solver-core" }
# Pinned exactly: the wasm-bindgen CLI used by scripts/build-wasm.mjs must match (D-009).
wasm-bindgen = "=0.2.129"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
# Deterministic, fast solver builds. No LTO surprises in debug; full LTO for shipped WASM.
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
